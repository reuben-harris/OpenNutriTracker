import java.util.Properties

plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "com.opennutritracker.ont.opennutritracker"
    compileSdkVersion 37
    buildToolsVersion "36.0.0"
    ndkVersion flutter.ndkVersion

    // ensures native .so libraries are packaged in the modern way needed
    // for page-aligned loading on newer devices.
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId "com.opennutritracker.ont.opennutritracker"
        // The health package's Health Connect client requires API 26; Flutter's
        // default is 24, so the floor is pinned here.
        //
        // The cost, which #651 raised the floor without measuring: this drops
        // Android 7.0 and 7.1. Play counts that as 1,399 device models — a
        // number that sounds alarming and is not, because measured against
        // real installs on 2026-08-29 it was **3 of 9,580 active users**,
        // 0.03% (#959). Accepted deliberately on that evidence: Health
        // Connect cannot ship below 26, so the alternative was dropping the
        // feature, and 1,399 models is a device-catalogue figure rather than
        // an audience.
        minSdkVersion 26
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    flavorDimensions "version"

    productFlavors {
        develop {
            dimension "version"
            applicationIdSuffix ".develop"
            versionNameSuffix "-develop"
        }
    }

}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    // Read finished workouts without the health plugin's distance and steps
    // reads — see HealthConnectWorkoutReader. This version requires
    // compileSdk 37 and AGP 9.1 or newer.
    implementation 'androidx.health.connect:connect-client:1.2.0-alpha06'
    // readRecords is a suspend function, and MainActivity answers the method
    // channel from the main dispatcher.
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
}
